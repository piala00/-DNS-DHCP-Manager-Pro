name: Compiler Diagnostic Windows Server
on:
  push:
    paths:
      - 'diagnostic_windows_server/**'
      - '.github/workflows/compiler-diagnostic-windows.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer PyInstaller
        run: python -m pip install pyinstaller
      - name: Compiler EXE autonome
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Diagnostic_Windows_Server diagnostic_windows_server/Diagnostic_Windows_Server.py
      - name: Verifier EXE
        shell: pwsh
        run: |
          if (!(Test-Path dist/Diagnostic_Windows_Server.exe)) { throw 'EXE absent' }
          Get-Item dist/Diagnostic_Windows_Server.exe | Select-Object Name,Length
      - name: Publier executable
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic_Windows_Server_EXE
          path: dist/Diagnostic_Windows_Server.exe
          retention-days: 30
