name: GTC Network IP Manager Pro - Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - 'GTC_Network_IP_Manager_Pro/**'
      - '.github/workflows/gtc-network-ip-manager-pro.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: GTC_Network_IP_Manager_Pro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: GTC_Network_IP_Manager_Pro/requirements-dev.txt

      - name: Install pinned dependencies
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Static analysis (pyflakes)
        shell: pwsh
        run: python -m pyflakes gtc_ipm tests main.py

      - name: Unit and UI tests (simulated data, offscreen Qt)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -v

      - name: Real Windows integration test (PowerShell syntax + read-only collectors)
        shell: pwsh
        run: python tests/windows_smoke.py

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name GTC_Network_IP_Manager_Pro `
            --version-file version_info.txt `
            --collect-submodules gtc_ipm `
            main.py
          if (!(Test-Path dist/GTC_Network_IP_Manager_Pro.exe)) { throw 'EXE missing' }
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path dist/GTC_Network_IP_Manager_Pro.exe))
          if ($b[0] -ne 77 -or $b[1] -ne 90) { throw 'Not a PE executable' }

      - name: Smoke test EXE without any Python on PATH
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'clean'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist/GTC_Network_IP_Manager_Pro.exe $dir
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:PYTHONHOME, Env:PYTHONPATH -ErrorAction SilentlyContinue
          if (Get-Command python -ErrorAction SilentlyContinue) { throw 'python still reachable on PATH' }
          $out = Join-Path $dir 'selftest.json'
          $p = Start-Process -FilePath (Join-Path $dir 'GTC_Network_IP_Manager_Pro.exe') `
                 -ArgumentList '--selftest', $out -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'selftest timeout' }
          if (!(Test-Path $out)) { throw "selftest produced no output (exit $($p.ExitCode))" }
          Get-Content $out -Raw
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if (-not $r.ok -or $p.ExitCode -ne 0) { throw 'selftest failed' }

      - name: Package portable ZIP and SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/GTC_Network_IP_Manager_Pro.exe pkg/
          Copy-Item README_FR.md, NOTES_VERSION.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath GTC_Network_IP_Manager_Pro_Portable_x64.zip -Force
          $h1 = (Get-FileHash dist/GTC_Network_IP_Manager_Pro.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash GTC_Network_IP_Manager_Pro_Portable_x64.zip -Algorithm SHA256).Hash
          "$h1  GTC_Network_IP_Manager_Pro.exe`n$h2  GTC_Network_IP_Manager_Pro_Portable_x64.zip" |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          "### SHA-256`n``````n$(Get-Content SHA256SUMS.txt -Raw)``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTC_Network_IP_Manager_Pro_Windows_x64
          path: |
            GTC_Network_IP_Manager_Pro/dist/GTC_Network_IP_Manager_Pro.exe
            GTC_Network_IP_Manager_Pro/GTC_Network_IP_Manager_Pro_Portable_x64.zip
            GTC_Network_IP_Manager_Pro/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release (main branch only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'gtc-ipm-pro-latest'
          $files = 'dist/GTC_Network_IP_Manager_Pro.exe','GTC_Network_IP_Manager_Pro_Portable_x64.zip','SHA256SUMS.txt'
          $existing = gh release list --repo "${{ github.repository }}" --json tagName --jq ".[] | select(.tagName == `"$tag`") | .tagName"
          if ($existing -eq $tag) {
            gh release upload $tag @files --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag @files --title 'GTC Network IP Manager Pro - latest build' `
              --notes 'Build CI Windows x64. Voir SHA256SUMS.txt. Validation en environnement AD/DHCP reel requise avant usage en production.' `
              --target "${{ github.sha }}" --repo "${{ github.repository }}"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
