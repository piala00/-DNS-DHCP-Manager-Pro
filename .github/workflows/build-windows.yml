name: Build and publish Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows Server 2022 environment
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) build $($os.BuildNumber)"
          if ($os.Caption -notmatch 'Windows Server') { throw 'Not running on Windows Server' }
          Get-Command Get-NetIPConfiguration -ErrorAction Stop | Out-Null
          Get-Command Get-WindowsFeature -ErrorAction Stop | Out-Null
          foreach ($role in @('AD-Domain-Services','DNS','DHCP')) {
            $feature = Get-WindowsFeature -Name $role -ErrorAction Stop
            Write-Host "$role available: $($feature.Name), installed: $($feature.Installed)"
          }
      - name: Run automated code tests
        run: python tests/test_static.py
      - name: Test diagnostic functions
        run: python tests/test_diagnostics.py
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Compile Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DNS_DHCP_Manager_Pro app.py
      - name: Validate executable and package ZIP
        shell: pwsh
        run: |
          $exe = 'dist/DNS_DHCP_Manager_Pro.exe'
          if (!(Test-Path $exe)) { throw 'Executable missing' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows PE executable' }
          Compress-Archive -Path $exe -DestinationPath 'DNS_DHCP_Manager_Pro_Windows_x64.zip' -Force
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNS_DHCP_Manager_Pro_Windows_x64
          path: DNS_DHCP_Manager_Pro_Windows_x64.zip
          if-no-files-found: error
      - name: Publish latest ZIP as GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $existing = gh release list --repo "${{ github.repository }}" --json tagName --jq '.[] | select(.tagName == "latest") | .tagName'
          if ($LASTEXITCODE -ne 0) { throw "Impossible de consulter les Releases GitHub." }
          if ($existing -eq 'latest') {
            gh release upload latest DNS_DHCP_Manager_Pro_Windows_x64.zip --clobber --repo "${{ github.repository }}"
          } else {
            gh release create latest DNS_DHCP_Manager_Pro_Windows_x64.zip --title "DNS DHCP Manager Pro - dernière compilation" --notes "Version de diagnostic. Ne configure pas encore AD DS/DNS/DHCP." --target "${{ github.sha }}" --repo "${{ github.repository }}"
          }
          if ($LASTEXITCODE -ne 0) { throw "Échec de publication du ZIP dans GitHub Releases." }
