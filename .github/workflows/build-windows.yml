name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Compile Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DNS_DHCP_Manager_Pro app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DNS_DHCP_Manager_Pro_Windows_x64
          path: dist/DNS_DHCP_Manager_Pro.exe
          if-no-files-found: error
