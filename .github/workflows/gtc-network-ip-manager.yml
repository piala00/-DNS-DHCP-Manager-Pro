name: Compiler GTC Network IP Manager Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'GTC_Network_IP_Manager/**'
      - '.github/workflows/gtc-network-ip-manager.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GTC_Network_IP_Manager GTC_Network_IP_Manager/app.py
          if (!(Test-Path dist/GTC_Network_IP_Manager.exe)) { throw "EXE absent" }
      - uses: actions/upload-artifact@v4
        with:
          name: GTC_Network_IP_Manager_Windows_x64
          path: dist/GTC_Network_IP_Manager.exe
          if-no-files-found: error
